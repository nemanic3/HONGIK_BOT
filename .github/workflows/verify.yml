name: Verify deployment
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/team4-frontend-dev copy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/team4-frontend-dev copy/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node ../../deploy/verify-assets.mjs out
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DB_PATH: /tmp/hongikbot-test.sqlite3
      DJANGO_MEDIA_ROOT: /tmp/hongikbot-test-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements-production.txt
      - run: python manage.py test --noinput
      - run: python manage.py makemigrations --check --dry-run
